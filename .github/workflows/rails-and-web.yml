name: Rails and Web CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production, codex/rails-api-migration]

permissions:
  contents: read

concurrency:
  group: rails-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - run: npm run build
      - name: Check bundle size budget
        run: npm run check:bundle
      # The speed gate (scripts/perf/budget.json): serves dist/ locally and loads the home and search
      # pages on a throttled phone profile in headless Chromium, failing on too many requests, too many
      # bytes or a slow LCP. The headless shell is the smallest Chromium Playwright offers.
      - name: Install headless Chromium for the speed gate
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Check page speed budget
        run: npm run check:perf
      # Builds the admin site too and proves neither build contains the other's pages.
      - name: Check public/admin site split
        run: npm run check:split
      - run: npm run test:all
      # Vitest unit tests for src/app/lib with a coverage floor (see vitest.config.ts).
      - run: npm run test:unit -- --coverage

  rails:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: musilynk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/musilynk_test
      SECRET_KEY_BASE: test-secret-key-base-only-for-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: backend
      # Since Rails 8.0, db:migrate on an empty database loads db/schema.rb instead of
      # running migrations. Remove it first so every migration really runs and the
      # file is re-dumped from migrations alone; the next step diffs it against the commit.
      - name: Run every migration on an empty database
        run: rm db/schema.rb && bin/rails db:migrate
      - name: Check db/schema.rb matches the migrations
        run: |
          if ! git diff --exit-code -- db/schema.rb; then
            echo "::error file=backend/db/schema.rb::db/schema.rb is out of date. Run bin/rails db:migrate locally and commit the regenerated schema."
            exit 1
          fi
      # SimpleCov (test/test_helper.rb) fails this step when line or branch coverage
      # drops under its floor; CI=true is what turns the floor on.
      - run: bin/rails test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rails-coverage-${{ github.run_id }}
          path: backend/coverage/
          retention-days: 7
          if-no-files-found: ignore
      - run: bin/rails zeitwerk:check

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: backend
      # Fails on any warning not listed in config/brakeman.ignore (each entry carries a review note).
      - name: Brakeman static analysis
        run: bundle exec brakeman --no-pager --exit-on-warn --exit-on-error
      - name: Audit gems against ruby-advisory-db
        run: bundle exec bundler-audit check --update

  integrated-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: musilynk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/musilynk_test
      SECRET_KEY_BASE: integration-test-secret-only
      FRONTEND_URL: http://127.0.0.1:4173
      ALLOWED_ORIGINS: http://127.0.0.1:4173
      VITE_API_URL: http://127.0.0.1:3000/api
      QA_API_BASE_URL: http://127.0.0.1:3000/api
      QA_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cd backend && bin/rails db:prepare
      - name: Start disposable Rails API
        run: |
          cd backend
          bin/rails server -b 127.0.0.1 -p 3000 > /tmp/musilynk-rails-test.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/live > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/musilynk-rails-test.log
          exit 1
      - run: npm run qa:e2e -- tests/e2e/integration-journeys.spec.ts --project=chromium-desktop --project=chromium-mobile
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integrated-journeys-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/musilynk-rails-test.log
          retention-days: 7
          if-no-files-found: ignore
