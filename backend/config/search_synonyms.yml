# Search vocabulary shared by every search surface (global search, type-ahead, jobs, talent,
# candidates, acts, urgent matching). Loaded once per process by Search::Synonyms.
# How to change it: docs/ops/search.md. Run `bin/rails test test/search` after every edit; the
# relevance suite (test/search/relevance_test.rb) pins the top results of 40 real queries.
#
# roles, instruments, genres, events: two-way synonym groups. Searching any member also searches
#   every other member. The FIRST entry is the label the type-ahead shows (keep its capitals);
#   the rest are spellings, Hinglish and Devanagari variants. Matching ignores case.
#   Words are matched whole, so "dhol" never finds "dholak": keep instruments that are different
#   things in different groups, even when one name starts with the other.
# broader: one-way expansions. Searching the key also searches the listed terms, but not the
#   reverse ("percussionist" finds tabla players; "tabla player" does not find every percussionist).
# cities: city names and their aliases (first entry is the label). A query word that is a city
#   constrains location fields only.
# stopwords: filler words dropped from multi-word queries ("vocalist for a wedding",
#   "shaadi ke liye dhol").

