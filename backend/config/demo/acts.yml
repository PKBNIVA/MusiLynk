# The 12 demo-showcase acts (SyntheticQa::Showcase). The leader is a demo musician of `leader`'s
# role, the other members are demo musicians of the listed roles. `pro: true` marks the five acts
# whose owners end up Verified Pro (three completed jobs and a published review, see reviews.yml): five people,
# 5 percent of the 110 musicians.
# Photos are left empty on purpose: the app draws art for demo acts.
acts:
  - name: The Saffron Room Band
    act_type: wedding-band
    pro: true
    leader: singer
    members: [keyboard-player, guitarist, drummer, bassist]
    genres: [Bollywood, Pop]
    event_types: [wedding, sangeet, reception, corporate]
    lineup_size: 6
    min_fee: 45000
    max_fee: 85000
    tagline: Six-piece band for sangeets and receptions
    bio: "We play two 45-minute sets of Hindi film songs from the 90s onwards, with a third set of dance numbers if the floor asks for it. The line-up brings its own in-ear monitors and a sound engineer, and we agree a must-play and do-not-play list with the family two weeks before the event."
  - name: Copper & Cane Acoustic
    act_type: trio
    pro: true
    leader: guitarist
    members: [singer, violinist]
    genres: [Acoustic, Indie]
    event_types: [wedding, private-party, restaurant]
    lineup_size: 3
    min_fee: 22000
    max_fee: 38000
    tagline: Guitar, voice and violin for cocktail hours and dinners
    bio: "A trio that plays soft arrangements of English and Hindi songs for cocktail hours, dinners and small ceremonies. We carry a compact PA for up to 150 guests and can play for 60 to 120 minutes."
  - name: Dhol Junction
    act_type: folk-group
    pro: true
    leader: dhol-player
    members: [dhol-player, tabla-player, dj]
    genres: [Bhangra, Folk]
    event_types: [wedding, sangeet, festival]
    lineup_size: 5
    min_fee: 15000
    max_fee: 30000
    tagline: Dhol team for baraats, entries and dance floors
    bio: "Two dhol players, a tabla player and a DJ who plays along with them. We lead baraats of 45 minutes on foot and stay on for the first dance hour, with a small speaker for the DJ and no need for a house PA."
  - name: Blue Lantern Jazz Trio
    act_type: trio
    pro: true
    leader: keyboard-player
    members: [bassist, drummer]
    genres: [Jazz, Blues]
    event_types: [hotel, restaurant, corporate]
    lineup_size: 3
    min_fee: 30000
    max_fee: 50000
    tagline: Piano trio for lounges, hotel lobbies and dinners
    bio: "A piano, bass and drums trio playing jazz standards, blues and quiet arrangements of pop songs. Two 45-minute sets fit a dinner service well, and we can add a guest vocalist with a week's notice."
  - name: Raagini Fusion Collective
    act_type: fusion-group
    pro: true
    leader: tabla-player
    members: [sitarist, bansuri-player, guitarist]
    genres: [Fusion, Hindustani]
    event_types: [festival, concert, corporate]
    lineup_size: 5
    min_fee: 50000
    max_fee: 90000
    tagline: Tabla-led fusion of ragas with guitar and flute
    bio: "We take ragas such as Yaman and Bhoopali and set them against guitar and light percussion. A concert runs 75 to 90 minutes, and we can play a shorter, quieter version for gallery openings and corporate dinners."
  - name: Noor-e-Sham Qawwali Party
    act_type: devotional-group
    leader: singer
    members: [tabla-player, keyboard-player, dhol-player]
    genres: [Qawwali, Sufi]
    event_types: [religious, cultural, private-party]
    lineup_size: 7
    min_fee: 42000
    max_fee: 78000
    tagline: Qawwali and Sufi kalaam for mehfils and urs programmes
    bio: "A party of seven with harmonium, tabla, dholak and a clapping chorus. We adjust the length of each piece to the room, and a smaller party of four is available for private mehfils and home gatherings."
  - name: Monsoon Static
    act_type: band
    leader: drummer
    members: [guitarist, bassist, singer]
    genres: [Rock, Indie]
    event_types: [club, college, festival]
    lineup_size: 4
    min_fee: 32000
    max_fee: 58000
    tagline: Original indie-rock and covers for clubs and campuses
    bio: "A four-piece with three released singles and a repertoire of 60 covers. We play 60 to 90 minute club sets and bring our own backline for college fests."
  - name: Afterparty Sax & Decks
    act_type: duo
    leader: dj
    members: [saxophonist]
    genres: [EDM, Bollywood]
    event_types: [wedding, club, corporate]
    lineup_size: 2
    min_fee: 28000
    max_fee: 48000
    tagline: DJ and live saxophone for late-night sets
    bio: "A DJ and a saxophonist who have played together for four years. We build a set of deep house and Bollywood remixes over two hours, with the sax coming in for the last hour of the night."
  - name: Marine Line Strings
    act_type: ensemble
    leader: violinist
    members: [violinist, keyboard-player]
    genres: [Western Classical, Film Score]
    event_types: [wedding, corporate, cultural]
    lineup_size: 4
    min_fee: 35000
    max_fee: 60000
    tagline: String quartet for entries, ceremonies and receptions
    bio: "A string quartet, with a keyboard when the venue allows, playing classical pieces, film themes and requested songs. We take on custom arrangements with three weeks' notice."
  - name: Second Cup Fusion
    act_type: fusion-group
    leader: singer
    members: [violinist, percussionist, keyboard-player]
    genres: [Carnatic, Fusion]
    event_types: [concert, cultural, festival]
    lineup_size: 5
    min_fee: 38000
    max_fee: 68000
    tagline: Carnatic-rooted fusion with violin and percussion
    bio: "Carnatic compositions and folk tunes arranged for voice, violin, keys and percussion. Concerts run about 80 minutes, and we prepare a short version for corporate cultural evenings."
  - name: Sundowner Sessions
    act_type: duo
    leader: saxophonist
    members: [guitarist]
    genres: [Acoustic, Jazz]
    event_types: [hotel, resort, restaurant]
    lineup_size: 2
    min_fee: 25000
    max_fee: 42000
    tagline: Saxophone and guitar for sunset and dinner sets
    bio: "A duo of saxophone and acoustic guitar playing slow jazz, bossa nova and instrumental versions of pop songs. Sets are 60 minutes long, and we travel to resorts with a small PA."
  - name: Pulse of the North
    act_type: band
    leader: singer
    members: [dhol-player, guitarist, drummer]
    genres: [Punjabi, Bhangra]
    event_types: [wedding, sangeet, club]
    lineup_size: 5
    min_fee: 46000
    max_fee: 82000
    tagline: Punjabi band with live dhol for sangeets and clubs
    bio: "Vocals, guitar, drums and a dhol player, playing Punjabi and Bhangra numbers from the 90s to today. We do one high-energy 90-minute set and can add a slower opening set for family functions."
