# Every rate limit, abuse control and spike threshold the API applies, in one place (RULES rule 2).
# Read through RateLimits (app/services/rate_limits.rb) and the UserRateLimit concern; no limit is
# written into a controller. The update path is docs/security/rate-limits.md.
#
# Each entry under `limits` is one named bucket (the first argument to throttle!,
# within_user_rate_limit?, failure_budget_exhausted? and record_failure!):
#   period_seconds   fixed window; counters live in Rails.cache for this long
#   limit            requests allowed per window (single-scope buckets)
#   scopes           per-scope limits for failure budgets, e.g. {email: 5, ip: 30}
#   fail             "closed" answers 503 RATE_LIMIT_UNAVAILABLE when the cache store cannot count
#                    (an outage must not turn off the guard on OTP and password reset); "open"
#                    (the default) lets the request through so a cache outage never takes the site down
#   key              what the counter is keyed by, for the docs table only: ip, user, email, phone, site
#   path             the route(s) it guards, for the docs table only
default: &default
  limits:
    # ---- Anyone on the internet can call these (no bearer token) ----
    register:
      path: POST /api/auth/register
      key: ip
      limit: 60
      period_seconds: 3600
      turnstile: true
    login-failure:
      path: POST /api/auth/login
      key: email+ip, email, ip (failures only)
      period_seconds: 900
      scopes: { email_ip: 10, email: 100, ip: 50 }
    otp-request:
      path: POST /api/auth/otp/request
      key: email, ip
      period_seconds: 3600
      # Mobile carriers put many users behind one IP (CGNAT); the per-email limit is the real guard.
      scopes: { email: 5, ip: 30 }
      fail: closed
      turnstile: true
    otp-verify-failure:
      path: POST /api/auth/otp/verify
      key: ip (failures only; per-code attempts capped by SignInCode::MAX_ATTEMPTS)
      period_seconds: 900
      scopes: { ip: 25 }
      fail: closed
    phone-otp-request:
      path: POST /api/auth/phone-otp/request
      key: phone, ip
      period_seconds: 3600
      scopes: { phone: 5, ip: 30 }
      fail: closed
    phone-otp-verify-failure:
      path: POST /api/auth/phone-otp/verify
      key: ip (failures only)
      period_seconds: 900
      scopes: { ip: 25 }
      fail: closed
    password-reset:
      path: POST /api/auth/forgot-password
      key: ip
      limit: 10
      period_seconds: 3600
      fail: closed
    reset-password-token:
      path: GET /api/auth/reset-password/check, POST /api/auth/reset-password
      key: ip
      limit: 30
      period_seconds: 900
      fail: closed
    resend-verification:
      path: POST /api/auth/resend-verification
      key: ip
      limit: 10
      period_seconds: 3600
    resend-verification-email:
      path: POST /api/auth/resend-verification (silent per-address cap, same answer either way)
      key: email
      limit: 3
      period_seconds: 3600
    second-factor-failure:
      path: POST /api/auth/second-factor
      key: ip, user (failures only)
      period_seconds: 900
      # Open on purpose: a cache outage must never lock every admin out of the admin site.
      scopes: { ip: 25, user: 10 }
    second-factor-challenge:
      path: POST /api/auth/login (admin password step, codes emailed)
      key: email
      period_seconds: 3600
      scopes: { email: 5 }
    search:
