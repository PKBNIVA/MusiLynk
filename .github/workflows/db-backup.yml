name: Database backup

# Nightly encrypted, off-Railway backup of production PostgreSQL. Every run also
# restores the dump into a throwaway database and fails if the restore does not
# check out, so a green run is a tested backup. See DEPLOYMENT.md "Backups and rollback".
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Railway Postgres service -> Variables -> DATABASE_PUBLIC_URL (the TCP proxy URL).
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SCRATCH_DATABASE_URL: postgres://postgres:scratch@localhost:5439/verse_restore
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        run: |
          missing=0
          [ -n "$DATABASE_URL" ] || { echo "::error::Set the PRODUCTION_DATABASE_URL repository secret"; missing=1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Set the BACKUP_PASSPHRASE repository secret"; missing=1; }
          [ "$missing" = 0 ] || exit 1

          # Tolerate a pasted value wrapped in whitespace or quotes, then check its
          # shape without printing it, so a wrong paste gets a precise error.
          url=$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')
          echo "::add-mask::$url"
          problem=""
          case "$url" in
            *'$'{{*) problem="it still contains Railway template text (a dollar sign and double braces); copy the resolved value" ;;
            *@:*) problem="its host is empty; turn on the TCP proxy in Railway and copy DATABASE_PUBLIC_URL again" ;;
            *.railway.internal*) problem="it is Railway's private URL; use DATABASE_PUBLIC_URL (host ends in proxy.rlwy.net)" ;;
            postgres://*@*:[0-9]*/* | postgresql://*@*:[0-9]*/*) ;;
            postgres://* | postgresql://*) problem="it is missing the user, host, port or database part" ;;
            *=postgres*) problem="it includes the variable name; paste only the value after the = sign" ;;
            *) problem="it does not start with postgresql://; paste the whole DATABASE_PUBLIC_URL value" ;;
          esac
          if [ -n "$problem" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not usable: $problem"
            exit 1
          fi
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      # pg_dump must be at least the server's major version, and the scratch
      # database matches it so the restore test is like-for-like.
      - name: Install PostgreSQL client matching the server
        run: |
          major=$(psql "$DATABASE_URL" -XAtc "select current_setting('server_version_num')::int / 10000")
          echo "PG_MAJOR=$major" >> "$GITHUB_ENV"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$major"
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"

      - name: Start scratch PostgreSQL
        run: |
          docker run -d --name scratch -p 5439:5432 \
            -e POSTGRES_PASSWORD=scratch -e POSTGRES_DB=verse_restore "postgres:$PG_MAJOR"
          for _ in $(seq 30); do pg_isready -q -h localhost -p 5439 && exit 0; sleep 2; done
          exit 1

      - name: Back up production
        run: scripts/db/backup.sh backups

      - name: Restore into scratch database and verify
        run: scripts/db/restore-verify.sh backups/*.dump.gpg

      - uses: actions/upload-artifact@v7
        with:
          name: verse-db-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
