      limit: 20
      period_seconds: 3600

  # Cloudflare Turnstile on sign-up and OTP request (docs/ops/turnstile.md). `enabled` is the
  # kill switch; the check also stays off until TURNSTILE_SECRET_KEY is set on the API service.
  turnstile:
    enabled: true
    verify_url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    timeout_seconds: 4
    # What happens when Cloudflare's verify endpoint itself errors or times out:
    # "closed" rejects the request (503 TURNSTILE_UNAVAILABLE, the client retries),
    # "open" lets it through and logs. Closed: an unverifiable challenge is no challenge.
    on_verifier_error: closed

  # RateLimitSpikeAlertJob (every 5 minutes): one Sentry message per bucket whose 429 count in the
  # last completed window is at or above `threshold`. Counters are kept in Rails.cache by
  # UserRateLimit#render_too_many_requests.
  spike_alert:
    window_seconds: 300
    threshold: 50
    # Per-bucket overrides when the default is wrong for a hot endpoint.
    thresholds:
      search: 200
      search-suggest: 300
      events: 300

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
