# The demo-showcase reviews (SyntheticQa::Showcase): twelve completed bookings and 18 reviews. Every booking
# carries a review from the hirer about the act's owner; the first six also carry one from the owner about the
# hirer. `pro_act` is the position (0-4) among the acts marked `pro: true` in acts.yml: those five owners each end
# up with three completed jobs and a published review, which makes them Verified Pro (5 percent of 110). Text is
# unique and specific; ratings are 4 or 5. `hirer_category` picks the kind of demo hirer who made the booking.
bookings:
  - event_name: Rooftop sangeet, 220 guests
    pro_act: 0
    event_type: sangeet
    hirer_category: wedding
    audience: 220
    duration_minutes: 150
    budget: [60000, 90000]
    requirements: "Three sets with a short break, dhol for the entry, a set list agreed with the family."
    performance_fee: 68000
    travel_fee: 4000
    hirer_review:
      rating: 5
      title: On time, and the dance floor filled by the second song
      body: "The band arrived two hours early, tested every microphone and asked for the family's must-play list before the first note. The set moved smoothly from soft Hindi songs to dance numbers, and the vocalist handled every request the grandparents made."
    musician_review:
      rating: 5
      title: Clear brief and payment on the day
      body: "The planner sent a run sheet a week ahead, arranged a green room and paid the balance before we packed up. Rare to work with a team that answers messages the same day."
  - event_name: Annual day dinner, 350 employees
    pro_act: 0
    event_type: corporate
    hirer_category: corporate
    audience: 350
    duration_minutes: 120
    budget: [45000, 70000]
    requirements: "Two 45-minute sets, family-friendly songs only, no explicit material."
    performance_fee: 52000
    travel_fee: 0
    hirer_review:
      rating: 5
      title: Exactly the volume we asked for
      body: "Conversation at the tables was never drowned out, and the closing set got the whole hall up. The team sent an invoice with the right GST details and left the stage cleaner than they found it."
    musician_review:
      rating: 4
      title: Well organised, slightly late soundcheck
      body: "The event team was polite and the hall was well prepared. The soundcheck started forty minutes late because the sound company was delayed, but we still finished in time."
  - event_name: Cocktail hour on a seaside lawn
    pro_act: 1
    event_type: wedding
    hirer_category: wedding
    audience: 120
    duration_minutes: 75
    budget: [25000, 40000]
    requirements: "A duo playing soft songs while guests arrive, then a change of pace for the last three numbers."
    performance_fee: 28000
    travel_fee: 3000
    hirer_review:
      rating: 5
      title: The right mood for the hour
      body: "We asked for something soft that would not stop people talking, and the duo got it right. They also changed the last three songs when the couple arrived early, without needing a cue."
    musician_review:
      rating: 5
      title: Considerate planners
      body: "The planners had shade, water and a power outlet ready for us, which is not always the case outdoors. They paid in full the same evening."
  - event_name: Friday lounge night with a live trio
    pro_act: 1
    event_type: club
    hirer_category: venue
    audience: 90
    duration_minutes: 180
    budget: [30000, 45000]
    requirements: "Three 45-minute sets for a lounge crowd, mostly jazz standards and soft pop."
    performance_fee: 34000
    travel_fee: 0
    hirer_review:
      rating: 4
      title: Good sets, solid repeat booking
      body: "The trio played to the room, keeping the first hour soft and lifting the energy after ten. One set ran ten minutes long, which did not bother anyone, but we would like a printed set list next time."
    musician_review:
      rating: 5
      title: A pleasure to play at this room
      body: "The stage is small but the sound system is well kept, and the owners gave us a meal between sets. Payment arrived by transfer before midnight."
  - event_name: Diwali evening for a bank's staff
    pro_act: 2
    event_type: corporate
    hirer_category: corporate
    audience: 250
    duration_minutes: 90
    budget: [20000, 35000]
    requirements: "A dhol entry at the start, then an hour of festive dance numbers with a DJ."
    performance_fee: 26000
    travel_fee: 2000
    hirer_review:
      rating: 5
      title: A high-energy start, then a calm hour
      body: "The dhol entry got the staff to their seats faster than any announcement, and the DJ kept the floor busy for the whole hour. Several people asked us to book the team again for next year."
    musician_review:
      rating: 4
      title: Friendly staff, one change on the day
      body: "The team changed the start time by thirty minutes on the day, but they informed us early and adjusted the fee for the extra wait. Good communication overall."
  - event_name: Baraat entry and reception dance hour
    pro_act: 2
    event_type: wedding
    hirer_category: wedding
    audience: 400
    duration_minutes: 120
    budget: [35000, 55000]
    requirements: "Dhol team for a 45-minute baraat, then a DJ set for the first dance hour."
    performance_fee: 42000
    travel_fee: 3000
    hirer_review:
      rating: 5
      title: The baraat set the tone for the night
      body: "The dhol players kept the family dancing for the full walk, and the DJ picked up the tempo without a gap once we reached the hall. They followed our timings closely, which mattered because the muhurat was fixed."
    musician_review:
      rating: 5
      title: Organised and respectful
      body: "The planners sent a map of the walk and had water bottles for the team. The family was warm, and we were paid in cash and by transfer as agreed."
  - event_name: Anniversary dinner in a hotel ballroom
    pro_act: 3
    event_type: hotel
    hirer_category: venue
    audience: 140
    duration_minutes: 120
    budget: [30000, 48000]
    requirements: "Two 50-minute sets of jazz standards while guests dine, with a short piano interlude during speeches."
    performance_fee: 36000
    travel_fee: 0
    hirer_review:
      rating: 5
      title: Kept the ballroom calm and the tables talking
      body: "The trio set up in twenty minutes, played below the level of conversation and stopped cleanly for each speech. The pianist reworked two songs for the couple after a request at the interval."
  - event_name: Chef's table evening at a rooftop restaurant
    pro_act: 3
    event_type: restaurant
    hirer_category: venue
    audience: 60
    duration_minutes: 150
    budget: [28000, 42000]
    requirements: "Quiet jazz and blues for a seven-course menu, no drum kit, brushes only."
    performance_fee: 32000
    travel_fee: 0
    hirer_review:
      rating: 4
      title: Right for the room, a little loud on the first set
      body: "The drummer used brushes as asked and the bass carried the room well. The first set was louder than the kitchen wanted, and the trio turned it down within two songs once we mentioned it."
  - event_name: Client evening for a law firm's partners
    pro_act: 3
    event_type: corporate
    hirer_category: corporate
    audience: 110
    duration_minutes: 105
    budget: [26000, 40000]
    requirements: "Instrumental jazz during the reception, one vocal number chosen by the managing partner."
    performance_fee: 33000
    travel_fee: 2000
    hirer_review:
      rating: 5
      title: Professional from the first email to the last note
      body: "The band sent a tech rider, arrived at the agreed time and learned the partner's song from a phone recording. Our guests asked for the trio's card before the evening ended."
  - event_name: Open-air weekend festival, second stage
    pro_act: 4
    event_type: festival
    hirer_category: agency
    audience: 900
    duration_minutes: 60
    budget: [55000, 80000]
    requirements: "A 60-minute set on the second stage at dusk, changeover in 15 minutes, own instruments and in-ear monitors."
    performance_fee: 62000
    travel_fee: 6000
    hirer_review:
      rating: 5
      title: A tight set that started on the minute
      body: "The collective finished a sound check in ten minutes on a shared backline and opened at exactly the slot time. The sitar and bansuri passages drew a crowd from the main stage, and the crew had no complaints."
  - event_name: College cultural night, main auditorium
    pro_act: 4
    event_type: concert
    hirer_category: college
    audience: 600
    duration_minutes: 75
    budget: [35000, 55000]
    requirements: "A 75-minute concert of instrumental fusion, with a short talk about the instruments for first-year students."
    performance_fee: 44000
    travel_fee: 5000
    hirer_review:
      rating: 5
      title: The students listened for seventy-five minutes
      body: "The tabla player explained each instrument in plain words between pieces, and the whole hall stayed in their seats. Our faculty coordinator has asked for the group again for the next academic year."
  - event_name: Screening night with a live score
    pro_act: 4
    event_type: cultural
    hirer_category: production
    audience: 180
    duration_minutes: 90
    budget: [40000, 60000]
    requirements: "Play live to the final 25 minutes of a short film, then a 30-minute set in the foyer."
    performance_fee: 46000
    travel_fee: 0
    hirer_review:
      rating: 4
      title: Careful with the cues, generous with the rehearsal
      body: "They asked for the cut two weeks early and rehearsed to picture twice on their own time. One entry drifted by a second on the night, and the guitarist corrected it without anyone in the audience noticing."
