# The demo-showcase musicians: role metadata plus 110 first-person bios (SyntheticQa::Showcase).
# Style card: two or three sentences in the person's own voice, concrete (numbers, rooms, gear,
# a habit), no superlatives, no pronouns for the writer beyond I/my/we, no invented famous names.
# `years` becomes years_experience, `genres` come from config/search_taxonomy.yml, `credits` are
# shown on the profile. The per-role lists below are consumed in order.
