name: Database backup

# Nightly encrypted, off-Railway backup of production PostgreSQL. Every run also
# restores the dump into a throwaway database and fails if the restore does not
# check out, so a green run is a tested backup. A failed run opens (or comments on) a
# GitHub issue labelled backup-failure, and a later green run closes it. When the
# BACKUP_S3_* secrets are set, each verified dump is also copied to R2/S3.
# See DEPLOYMENT.md "Backups and rollback".
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Railway Postgres service -> Variables -> DATABASE_PUBLIC_URL (the TCP proxy URL).
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SCRATCH_DATABASE_URL: postgres://postgres:scratch@localhost:5439/musilynk_restore
      # Optional off-GitHub copy (Cloudflare R2 or any S3-compatible store). All unset = skipped.
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets are configured
        run: |
          missing=0
          [ -n "$DATABASE_URL" ] || { echo "::error::Set the PRODUCTION_DATABASE_URL repository secret"; missing=1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Set the BACKUP_PASSPHRASE repository secret"; missing=1; }
          [ "$missing" = 0 ] || exit 1

          # Tolerate a pasted value wrapped in whitespace or quotes, then check its
          # shape without printing it, so a wrong paste gets a precise error.
          url=$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')
          echo "::add-mask::$url"
          problem=""
          case "$url" in
            *'$'{{*) problem="it still contains Railway template text (a dollar sign and double braces); copy the resolved value" ;;
            *@:*) problem="its host is empty; turn on the TCP proxy in Railway and copy DATABASE_PUBLIC_URL again" ;;
            *.railway.internal*) problem="it is Railway's private URL; use DATABASE_PUBLIC_URL (host ends in proxy.rlwy.net)" ;;
            postgres://*@*:[0-9]*/* | postgresql://*@*:[0-9]*/*) ;;
            postgres://* | postgresql://*) problem="it is missing the user, host, port or database part" ;;
            *=postgres*) problem="it includes the variable name; paste only the value after the = sign" ;;
            *) problem="it does not start with postgresql://; paste the whole DATABASE_PUBLIC_URL value" ;;
          esac
          if [ -n "$problem" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not usable: $problem"
            exit 1
          fi
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      # pg_dump must be at least the server's major version, and the scratch
      # database matches it so the restore test is like-for-like.
      - name: Install PostgreSQL client matching the server
        run: |
          major=$(psql "$DATABASE_URL" -XAtc "select current_setting('server_version_num')::int / 10000")
          echo "PG_MAJOR=$major" >> "$GITHUB_ENV"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$major"
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"

      - name: Start scratch PostgreSQL
        run: |
          docker run -d --name scratch -p 5439:5432 \
            -e POSTGRES_PASSWORD=scratch -e POSTGRES_DB=musilynk_restore "postgres:$PG_MAJOR"
          for _ in $(seq 30); do pg_isready -q -h localhost -p 5439 && exit 0; sleep 2; done
          exit 1

      - name: Back up production
        run: scripts/db/backup.sh backups

      - name: Restore into scratch database and verify
        run: scripts/db/restore-verify.sh backups/*.dump.gpg

      - uses: actions/upload-artifact@v7
        with:
          name: verse-db-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error

      # Only the encrypted dump, its checksum and the manifest are uploaded (never plaintext),
      # under a dated key so a bucket lifecycle rule can expire old copies.
      - name: Copy verified backup to off-GitHub storage
        if: env.BACKUP_S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          # Recent AWS CLI versions add checksums some S3-compatible stores reject; send them only when required.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          missing=0
          [ -n "$BACKUP_S3_ACCESS_KEY_ID" ] || { echo "::error::Set BACKUP_S3_ACCESS_KEY_ID (or remove BACKUP_S3_BUCKET to skip the copy)"; missing=1; }
          [ -n "$BACKUP_S3_SECRET_ACCESS_KEY" ] || { echo "::error::Set BACKUP_S3_SECRET_ACCESS_KEY (or remove BACKUP_S3_BUCKET to skip the copy)"; missing=1; }
          [ "$missing" = 0 ] || exit 1
          export AWS_DEFAULT_REGION="${BACKUP_S3_REGION:-auto}"
          endpoint=()
          [ -z "$BACKUP_S3_ENDPOINT" ] || endpoint=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          prefix="verse-db/$(date -u +%Y/%m/%d)/run-${GITHUB_RUN_ID}"
          shopt -s nullglob
          files=(backups/*.dump.gpg backups/*.dump.sha256 backups/*.manifest.tsv)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No backup files to copy"; exit 1; }
          for file in "${files[@]}"; do
            aws s3 cp "${endpoint[@]}" --only-show-errors --no-progress "$file" "s3://$BACKUP_S3_BUCKET/$prefix/$(basename "$file")"
          done
          # Read the copy back so a silently truncated upload fails the run.
          dump=$(basename backups/*.dump.gpg)
          remote_size=$(aws s3api head-object "${endpoint[@]}" --bucket "$BACKUP_S3_BUCKET" --key "$prefix/$dump" --query ContentLength --output text)
          local_size=$(stat -c %s "backups/$dump")
          [ "$remote_size" = "$local_size" ] || { echo "::error::Uploaded dump is $remote_size bytes, expected $local_size"; exit 1; }
          echo "Copied ${#files[@]} files to s3://$BACKUP_S3_BUCKET/$prefix/"

  # Alerts without any new service: a failed or cancelled backup opens a GitHub issue
  # labelled backup-failure (or comments on the one already open), which emails the repo
  # owner through normal GitHub notifications. The next green run closes it. Optionally
  # also POSTs JSON to ALERT_WEBHOOK_URL (Slack/Discord-compatible "text" field).
  alert:
    needs: backup
    if: always() && needs.backup.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.backup.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Open or update the backup-failure issue
        if: needs.backup.result != 'success'
        run: |
          gh label create backup-failure --color B60205 --description "Nightly database backup failed" 2>/dev/null || true
          body="The nightly database backup **${RESULT}** on $(date -u '+%Y-%m-%d %H:%M UTC') (trigger: ${GITHUB_EVENT_NAME}).

          Run: ${RUN_URL}

          Open the run, fix the failing step, then re-run it (Actions -> Database backup -> Run workflow). This issue closes itself after the next successful backup."
          existing=$(gh issue list --label backup-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Database backup failed" --label backup-failure --body "$body"
          fi

      - name: Post to alert webhook
        if: needs.backup.result != 'success' && env.ALERT_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n --arg text "MusiLynk database backup ${RESULT}: ${RUN_URL}" --arg result "$RESULT" --arg url "$RUN_URL" --arg repo "$GH_REPO" \
            '{text: $text, content: $text, event: "backup_failure", result: $result, runUrl: $url, repository: $repo}')
          curl -fsS --max-time 20 --retry 2 -H "Content-Type: application/json" -d "$payload" "$ALERT_WEBHOOK_URL" > /dev/null \
            || echo "::warning::Alert webhook POST failed; the GitHub issue is still the primary alert"

      - name: Close the backup-failure issue after a green run
        if: needs.backup.result == 'success'
        run: |
          for number in $(gh issue list --label backup-failure --state open --json number --jq '.[].number' || true); do
            gh issue close "$number" --reason completed --comment "Backup succeeded again: ${RUN_URL}"
          done
