name: MusiLynk QA Agent

on:
  pull_request:
  push:
    branches: [production, codex/rails-api-migration]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Frontend URL to test
        required: false
        default: https://musilynk.vercel.app
      api_base_url:
        description: Rails API URL including /api
        required: false
        default: https://musilynk-api-production.up.railway.app/api
      full_browser_matrix:
        description: Also run Firefox desktop and mobile WebKit
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: musilynk-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-experience:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-agent-local-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  live-synthetic:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      summary: ${{ steps.summary.outputs.text }}
    env:
      QA_BASE_URL: ${{ inputs.base_url || 'https://musilynk.vercel.app' }}
      QA_API_BASE_URL: ${{ inputs.api_base_url || 'https://musilynk-api-production.up.railway.app/api' }}
      QA_FULL_MATRIX: ${{ inputs.full_browser_matrix && 'true' || 'false' }}
      # Deploy verification: a manual run (dispatched from the branch that was just deployed)
      # waits up to 5 minutes for /api/health and the web app to report this commit.
      # Scheduled runs may legitimately test an older deploy, so they leave it empty.
      QA_EXPECTED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
      # Signed-in smoke (tests/e2e/live-account-smoke.spec.ts): signs in as a dedicated
      # jobseeker test account, saves and deletes a job alert, then signs out. It skips
      # itself until both repository secrets exist.
      QA_SMOKE_EMAIL: ${{ secrets.QA_SMOKE_EMAIL }}
      QA_SMOKE_PASSWORD: ${{ secrets.QA_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install standard browser
        if: env.QA_FULL_MATRIX != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install full browser matrix
        if: env.QA_FULL_MATRIX == 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Report whether the signed-in smoke will run
        run: |
          if [ -n "$QA_SMOKE_EMAIL" ] && [ -n "$QA_SMOKE_PASSWORD" ]; then
            echo "::notice::Signed-in live smoke enabled (QA_SMOKE_EMAIL is set)."
          else
            echo "::notice::Signed-in live smoke skipped: add the QA_SMOKE_EMAIL and QA_SMOKE_PASSWORD repository secrets to enable it."
          fi
      - run: npm run qa:e2e
      # Runs even when the tests failed. Reads the JSON report the CI reporter writes
      # (playwright.config.ts) and turns it into a few lines for the run page and for the
      # issue comment below. It never fails the job itself.
      - name: Summarise the run
        id: summary
        if: always()
        run: |
          node - <<'NODE' > summary.txt
          const fs = require('fs');
          const smoke = process.env.QA_SMOKE_EMAIL && process.env.QA_SMOKE_PASSWORD;
          const lines = [];
          try {
            const report = JSON.parse(fs.readFileSync('test-results/qa-results.json', 'utf8'));
            const { expected = 0, unexpected = 0, flaky = 0, skipped = 0 } = report.stats || {};
            lines.push(`${expected} passed, ${unexpected} failed, ${flaky} flaky, ${skipped} skipped against ${process.env.QA_BASE_URL}.`);
            const failed = [];
            const walk = (suite, trail) => {
              const here = suite.title ? [...trail, suite.title] : trail;
              for (const spec of suite.specs || []) if (spec.ok === false) failed.push([...here, spec.title].join(' › '));
              for (const child of suite.suites || []) walk(child, here);
            };
            for (const suite of report.suites || []) walk(suite, []);
            if (failed.length) lines.push('', 'Failing tests:', ...failed.slice(0, 15).map((title) => `- ${title}`));
            if (failed.length > 15) lines.push(`- and ${failed.length - 15} more`);
          } catch {
            lines.push('No test report was written: the run stopped before the tests finished (install, build or timeout).');
          }
          lines.push('', smoke
            ? 'The signed-in smoke test ran.'
            : 'The signed-in smoke test was skipped: add the QA_SMOKE_EMAIL and QA_SMOKE_PASSWORD repository secrets (a dedicated musician account).');
          process.stdout.write(lines.join('\n') + '\n');
          NODE
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          { echo 'text<<QA_SUMMARY_EOF'; cat summary.txt; echo 'QA_SUMMARY_EOF'; } >> "$GITHUB_OUTPUT"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-agent-live-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Alerts without any new service, the same pattern as .github/workflows/db-backup.yml: a failed
  # nightly or manual live run opens a GitHub issue labelled qa-failure (or comments on the one
  # already open), which emails the repo owner through normal GitHub notifications. The failure text
  # carries the run summary, and the next green run closes the issue with its own summary. A
  # cancelled run (a newer run superseded it) is not a failure and opens nothing.
  alert:
    needs: live-synthetic
    if: always() && needs.live-synthetic.result != 'skipped' && needs.live-synthetic.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUMMARY: ${{ needs.live-synthetic.outputs.summary }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the qa-failure issue
        if: needs.live-synthetic.result != 'success'
        run: |
          gh label create qa-failure --color B60205 --description "Live QA run failed" 2>/dev/null || true
          body="The live QA run failed on $(date -u '+%Y-%m-%d %H:%M UTC') (trigger: ${GITHUB_EVENT_NAME}).

          ${SUMMARY:-No summary was produced.}

          Run: ${RUN_URL} (the report and traces are attached to it as an artifact for 7 days).

          This issue closes itself after the next successful live run."
          existing=$(gh issue list --label qa-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live QA run failed" --label qa-failure --body "$body"
          fi

      - name: Close the qa-failure issue after a green run
        if: needs.live-synthetic.result == 'success'
        run: |
          for number in $(gh issue list --label qa-failure --state open --json number --jq '.[].number' || true); do
            gh issue close "$number" --reason completed --comment "The live QA run passed again: ${RUN_URL}

          ${SUMMARY}"
          done
